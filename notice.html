<!doctype html>
<html lang="bn"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TUCLC Notice</title><link rel="icon" href="assets/logo.png"><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>.noticePage{min-height:100vh;padding:45px 0;background:linear-gradient(135deg,#effaff,#fff5fa)}.noticeDetail{background:#fff;border-radius:24px;padding:30px;box-shadow:0 18px 55px rgba(0,0,0,.08)}.noticeDetail h1{margin:0 0 10px;color:#10213b}.noticeDate{color:#087fc1;font-weight:700;margin-bottom:22px}.noticeBody{white-space:pre-wrap;line-height:1.9;color:#334155;font-size:17px}.back{margin-top:20px}</style>
</head><body><section class="noticePage"><div class="wrap"><div id="noticeBox" class="noticeDetail">নোটিশ লোড হচ্ছে...</div><a class="btn outline back" href="index.html#notices">← নোটিশে ফিরে যান</a></div></section>
<script>
const db=window.supabase.createClient('https://wdiiftvtmtvsokdgyqmr.supabase.co','sb_publishable_RphPgkyVKZkZeIgklmt8hQ__W3aGPiX');
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
(async()=>{const id=new URLSearchParams(location.search).get('id');const box=document.getElementById('noticeBox');if(!id){box.innerHTML='<h1>নোটিশ পাওয়া যায়নি</h1>';return;}const {data,error}=await db.from('notices').select('*').eq('id',id).eq('published',true).maybeSingle();if(error||!data){box.innerHTML='<h1>নোটিশ পাওয়া যায়নি</h1><p>এই নোটিশটি আর প্রকাশিত নেই।</p>';return;}box.innerHTML=`<div class="noticeDate">${esc(data.notice_date||'')}</div><h1>${esc(data.title)}</h1><div class="noticeBody">${esc(data.body||'')}</div>`;})();
</script></body></html>
