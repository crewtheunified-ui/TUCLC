<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>TUCLC Admin Panel</title>

  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body{
      margin:0;
      background:#f5fbfe;
      font-family:"Hind Siliguri",sans-serif;
    }

    .admin-login{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:20px;
      background:linear-gradient(135deg,#e9f9ff,#fff0f7);
    }

    .login-box{
      width:min(430px,100%);
      background:#fff;
      padding:32px;
      border-radius:24px;
      box-shadow:0 20px 55px rgba(0,0,0,.12);
      text-align:center;
    }

    .login-box img{
      width:115px;
      height:115px;
      object-fit:contain;
      margin-bottom:10px;
    }

    .login-box h2{
      margin:8px 0;
      color:#10213b;
    }

    .login-box p{
      color:#617085;
    }

    .login-input{
      width:100%;
      box-sizing:border-box;
      padding:13px 14px;
      margin:7px 0;
      border:1px solid #d5e3ea;
      border-radius:10px;
      font:inherit;
      outline:none;
    }

    .login-input:focus{
      border-color:#19aee8;
    }

    .login-error{
      min-height:24px;
      color:#d82732;
      margin-top:8px;
    }

    .admin-wrap{
      width:min(1250px,94%);
      margin:25px auto;
      padding-bottom:50px;
    }

    .admin-top{
      background:#fff;
      padding:18px 22px;
      border-radius:18px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:15px;
      box-shadow:0 8px 25px rgba(0,0,0,.06);
    }

    .admin-top h2{
      margin:0;
      color:#10213b;
    }

    .admin-top small{
      display:block;
      color:#6b7d8b;
      margin-top:3px;
    }

    .tabs{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin:18px 0;
    }

    .tab{
      border:1px solid #dce8ee;
      background:#fff;
      padding:10px 14px;
      border-radius:10px;
      cursor:pointer;
      font:600 15px "Hind Siliguri";
    }

    .tab.active{
      background:#087fc1;
      color:#fff;
      border-color:#087fc1;
    }

    .panel-box{
      background:#fff;
      border-radius:18px;
      padding:22px;
      margin-bottom:18px;
      box-shadow:0 8px 25px rgba(0,0,0,.05);
    }

    .form-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:12px;
    }

    .form-grid input,
    .form-grid textarea,
    .form-grid select{
      width:100%;
      box-sizing:border-box;
      padding:12px 13px;
      border:1px solid #d5e3ea;
      border-radius:10px;
      font:inherit;
    }

    .form-grid textarea{
      grid-column:1/-1;
      min-height:90px;
      resize:vertical;
    }

    .full{
      grid-column:1/-1;
    }

    .btn{
      border:0;
      border-radius:10px;
      padding:11px 16px;
      font:600 15px "Hind Siliguri";
      cursor:pointer;
    }

    .btn-red{
      background:#ef3035;
      color:#fff;
    }

    .btn-green{
      background:#079447;
      color:#fff;
    }

    .btn-blue{
      background:#087fc1;
      color:#fff;
    }

    .btn-light{
      background:#fff;
      border:1px solid #ccdce5;
      color:#10213b;
    }

    .btn-danger{
      background:#d82732;
      color:#fff;
    }

    .btn-small{
      padding:7px 10px;
      font-size:13px;
    }

    .actions{
      display:flex;
      gap:7px;
      flex-wrap:wrap;
    }

    .table-wrap{
      overflow:auto;
    }

    table{
      width:100%;
      min-width:900px;
      border-collapse:collapse;
    }

    th,td{
      padding:11px;
      border-bottom:1px solid #e5edf2;
      text-align:left;
      vertical-align:middle;
      font-size:14px;
    }

    th{
      background:#f3fbff;
      color:#10213b;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:15px;
    }

    .stat{
      background:linear-gradient(135deg,#fff,#effaff);
      border:1px solid #e1edf4;
      border-radius:16px;
      padding:22px;
    }

    .stat strong{
      display:block;
      font-size:32px;
      color:#087fc1;
    }

    .modal{
      display:none;
      position:fixed;
      inset:0;
      z-index:9999;
      background:rgba(7,27,45,.72);
      padding:18px;
      align-items:center;
      justify-content:center;
    }

    .modal-box{
      width:min(760px,100%);
      max-height:90vh;
      overflow:auto;
      background:#fff;
      border-radius:20px;
      padding:24px;
    }

    .modal-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:15px;
      margin-bottom:18px;
    }

    .modal-close{
      border:0;
      width:40px;
      height:40px;
      border-radius:10px;
      background:#fee2e2;
      color:#d82732;
      font-size:23px;
      cursor:pointer;
    }

    .muted{
      color:#6b7d8b;
      font-size:13px;
    }

    @media(max-width:720px){
      .form-grid,
      .stats{
        grid-template-columns:1fr;
      }

      .form-grid textarea,
      .full{
        grid-column:auto;
      }

      .admin-top{
        flex-direction:column;
        align-items:flex-start;
      }
    }
  </style>
</head>

<body>

    <input
      id="loginEmail"

      type="email"

<!-- =====================================================

<section

  <div class="admin-top">

    </div>

    <button

  <div class="tabs">

    <button

    <button

    <button

<!-- =====================================================
     MODAL
===================================================== -->

<div
  id="modal"
  class="modal"
>

  <div class="modal-box">

    <div class="modal-head">

      <h2 id="modalTitle">
        Form
      </h2>

      <button
        class="modal-close"
        onclick="closeModal()"
      >
        ×
      </button>

    </div>

    <div id="modalBody"></div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://wdiiftvtmtvsokdgyqmr.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_RphPgkyVKZkZeIgklmt8hQ__W3aGPiX";

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

const ADMIN_EMAIL =
  "crewtheunified@gmail.com";


function esc(value){

  return String(value ?? "")
    .replace(/[&<>"']/g, m => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m]));

}


/* =====================================================
   LOGIN
===================================================== */

async function doLogin(){

  const email =
    document.getElementById(
      "loginEmail"
    ).value.trim();

  const password =
    document.getElementById(
      "loginPassword"
    ).value;

  const errorBox =
    document.getElementById(
      "loginError"
    );


  errorBox.textContent = "";


  if(!email || !password){

    errorBox.textContent =
      "Email ও Password দিন।";

    return;
  }


  const {
    data,
    error
  } =
    await db.auth.signInWithPassword({
      email,
      password
    });


  if(error){

    errorBox.textContent =
      error.message;

    return;
  }


  if(
    !data.user ||
    data.user.email.toLowerCase()
      !== ADMIN_EMAIL.toLowerCase()
  ){

    await db.auth.signOut();

    errorBox.textContent =
      "এই account-এর Admin permission নেই।";

    return;
  }


  document.getElementById(
    "loginScreen"
  ).style.display = "none";


  document.getElementById(
    "adminApp"
  ).style.display = "block";


  openTab("dashboard");

}


async function doLogout(){

  await db.auth.signOut();

  document.getElementById(
    "adminApp"
  ).style.display = "none";


  document.getElementById(
    "loginScreen"
  ).style.display = "grid";


  document.getElementById(
    "loginPassword"
  ).value = "";

}


/* =====================================================
   TABS
===================================================== */

function openTab(type, button){

  document
    .querySelectorAll(".tab")
    .forEach(
      x => x.classList.remove("active")
    );


  if(button)
    button.classList.add("active");


  if(type === "dashboard")
    dashboardPage();

  if(type === "students")
    studentsPage();

  if(type === "teachers")
    teachersPage();

  if(type === "results")
    resultsPage();

  if(type === "notices")
    noticesPage();

  if(type === "admissions")
    admissionsPage();

  if(type === "settings")
    settingsPage();

}


/* =====================================================
   DASHBOARD
===================================================== */

async function dashboardPage(){

  const [
    studentRes,
    teacherRes,
    resultRes
  ] = await Promise.all([

    db
      .from("students")
      .select("id"),

    db
      .from("teachers")
      .select("id"),

    db
      .from("exam_results")
      .select("id")

  ]);


  document.getElementById(
    "content"
  ).innerHTML = `

    <div class="panel-box">

      <h2>
        Welcome TUCLC Admin 👋
      </h2>

      <p class="muted">
        Real Online Database:
        Supabase PostgreSQL +
        Secure Authentication
      </p>

    </div>


    <div class="stats">

      <div class="stat">

        <strong>
          ${(studentRes.data || []).length}
        </strong>

        <span>
          Students
        </span>

      </div>


      <div class="stat">

        <strong>
          ${(teacherRes.data || []).length}
        </strong>

        <span>
          Teachers
        </span>

      </div>


      <div class="stat">

        <strong>
          ${(resultRes.data || []).length}
        </strong>

        <span>
          Exam Results
        </span>

      </div>

    </div>

  `;

}


/* =====================================================
   STUDENTS
===================================================== */

async function studentsPage(){

  const {
    data,
    error
  } =
    await db
      .from("students")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    alert(error.message);

    return;
  }


  document.getElementById(
    "content"
  ).innerHTML = `

    <div class="panel-box">

      <div
        style="
          display:flex;
          justify-content:space-between;
          align-items:center;
          gap:10px;
          margin-bottom:18px;
        "
      >

        <div>

          <h2 style="margin:0">
            👨‍🎓 Students
          </h2>

          <div class="muted">
            Student Add / Edit / Delete
          </div>

        </div>

        <button
          class="btn btn-blue"
          onclick="addStudentForm()"
        >
          + Add Student
        </button>

      </div>


      <div class="table-wrap">

        <table>

          <thead>

            <tr>

              <th>Name</th>
              <th>Student ID</th>
              <th>Class</th>
              <th>Roll</th>
              <th>বিভাগ / Batch</th>
              <th>Guardian</th>
              <th>Phone</th>
              <th>Action</th>

            </tr>

          </thead>

          <tbody>

            ${(data || []).map(
              x => `

                <tr>

                  <td>
                    <strong>
                      ${esc(x.name)}
                    </strong>
                  </td>

                  <td>
                    ${esc(x.student_id)}
                  </td>

                  <td>
                    ${esc(x.class_name || "—")}
                  </td>

                  <td>
                    ${esc(x.roll ?? "—")}
                  </td>

                  <td>
                    ${esc(x.batch || "—")}
                  </td>

                  <td>
                    ${esc(x.guardian_name || "—")}
                  </td>

                  <td>
                    ${esc(x.guardian_phone || "—")}
                  </td>

                  <td>

                    <div class="actions">

                      <button
                        class="btn btn-small btn-blue"
                        onclick="editStudent('${x.id}')"
                      >
                        Edit
                      </button>

                      <button
                        class="btn btn-small btn-danger"
                        onclick="deleteStudent('${x.id}')"
                      >
                        Delete
                      </button>

                    </div>

                  </td>

                </tr>

              `
            ).join("")}

          </tbody>

        </table>

      </div>

    </div>

  `;

}


/* =====================================================
   ADD STUDENT
===================================================== */

function addStudentForm(){

  openModal(
    "Add Student",
    `
      <div class="form-grid">

        <input
          id="studentName"
          placeholder="শিক্ষার্থীর নাম"
        >

        <input
          id="studentId"
          placeholder="Student ID"
        >

        <input
          id="studentClass"
          placeholder="Class"
        >

        <input
          id="studentRoll"
          type="number"
          placeholder="Roll"
        >

        <input
          id="studentBatch"
          placeholder="বিভাগ / Batch"
        >

        <input
          id="studentGuardian"
          placeholder="Guardian Name"
        >

        <input
          id="studentPhone"
          placeholder="Guardian Phone"
        >

      </div>

      <br>

      <button
        class="btn btn-green"
        onclick="saveStudent()"
      >
        Save Student
      </button>
    `
  );

}


async function saveStudent(){

  const roll =
    document.getElementById(
      "studentRoll"
    ).value.trim();


  const row = {

    name:
      document.getElementById(
        "studentName"
      ).value.trim(),

    student_id:
      document.getElementById(
        "studentId"
      ).value.trim(),

    class_name:
      document.getElementById(
        "studentClass"
      ).value.trim() || null,

    roll:
      roll === ""
        ? null
        : Number(roll),

    batch:
      document.getElementById(
        "studentBatch"
      ).value.trim() || null,

    guardian_name:
      document.getElementById(
        "studentGuardian"
      ).value.trim() || null,

    guardian_phone:
      document.getElementById(
        "studentPhone"
      ).value.trim() || null

  };


  if(
    !row.name ||
    !row.student_id
  ){

    alert(
      "Student Name ও Student ID দিন।"
    );

    return;
  }


  const {
    error
  } =
    await db
      .from("students")
      .insert(row);


  if(error){

    alert(error.message);

    return;
  }


  closeModal();

  await studentsPage();

  alert(
    "Student successfully added."
  );

}


/* =====================================================
   EDIT STUDENT
===================================================== */

async function editStudent(id){

  const {
    data,
    error
  } =
    await db
      .from("students")
      .select("*")
      .eq("id",id)
      .single();


  if(error){

    alert(error.message);

    return;
  }


  openModal(
    "Edit Student",
    `
      <div class="form-grid">

        <input
          id="studentName"
          value="${esc(data.name)}"
          placeholder="শিক্ষার্থীর নাম"
        >

        <input
          id="studentId"
          value="${esc(data.student_id)}"
          placeholder="Student ID"
        >

        <input
          id="studentClass"
          value="${esc(data.class_name || "")}"
          placeholder="Class"
        >

        <input
          id="studentRoll"
          type="number"
          value="${data.roll ?? ""}"
          placeholder="Roll"
        >

        <input
          id="studentBatch"
          value="${esc(data.batch || "")}"
          placeholder="বিভাগ / Batch"
        >

        <input
          id="studentGuardian"
          value="${esc(data.guardian_name || "")}"
          placeholder="Guardian Name"
        >

        <input
          id="studentPhone"
          value="${esc(data.guardian_phone || "")}"
          placeholder="Guardian Phone"
        >

      </div>

      <br>

      <button
        class="btn btn-green"
        onclick="updateStudent('${id}')"
      >
        Update Student
      </button>
    `
  );

}


async function updateStudent(id){

  const roll =
    document.getElementById(
      "studentRoll"
    ).value.trim();


  const row = {

    name:
      document.getElementById(
        "studentName"
      ).value.trim(),

    student_id:
      document.getElementById(
        "studentId"
      ).value.trim(),

    class_name:
      document.getElementById(
        "studentClass"
      ).value.trim() || null,

    roll:
      roll === ""
        ? null
        : Number(roll),

    batch:
      document.getElementById(
        "studentBatch"
      ).value.trim() || null,

    guardian_name:
      document.getElementById(
        "studentGuardian"
      ).value.trim() || null,

    guardian_phone:
      document.getElementById(
        "studentPhone"
      ).value.trim() || null,

    updated_at:
      new Date().toISOString()

  };


  const {
    error
  } =
    await db
      .from("students")
      .update(row)
      .eq("id",id);


  if(error){

    alert(error.message);

    return;
  }


  closeModal();

  await studentsPage();

}


async function deleteStudent(id){

  if(
    !confirm(
      "এই Student-কে Delete করতে চান?"
    )
  )
    return;


  const {
    error
  } =
    await db
      .from("students")
      .delete()
      .eq("id",id);


  if(error){

    alert(error.message);

    return;
  }


  await studentsPage();

}

      >

        <h2>
          👨‍🏫 Teachers

        <button

          + Add Teacher
        </button>

      </div>

    <div class="panel-box table-wrap">

      <table>

        <thead>

          <tr>
            <th>Name</th>
            <th>Subject</th>
            <th>Qualification</th>
            <th>Designation</th>
            <th>Action</th>
          </tr>

        </thead>

        <tbody>

          ${(data || []).map(
            t => `

              <tr>

                <td>
                  ${esc(t.name)}
                </td>

                <td>
                  ${esc(t.subject || "—")}
                </td>

                <td>
                  ${esc(t.qualification || "—")}
                </td>

                <td>
                  ${esc(t.designation || "—")}
                </td>

                <td>

                  <button
                    class="btn btn-small btn-danger"

                  >
                    Delete
                  </button>

                </td>

              </tr>

            `
          ).join("")}

        </tbody>

      </table>

    </div>

  `;

}


function addTeacherForm(){

  openModal(
    "Add Teacher",
    `
      <div class="form-grid">

        <input id="teacherName"
          placeholder="Teacher Name">

        <input id="teacherSubject"
          placeholder="Subject">

        <input id="teacherQualification"
          placeholder="Qualification">

        <input id="teacherDesignation"
          placeholder="Designation">

        <input id="teacherPhoto"
          placeholder="Photo URL">

      </div>

      <br>

      <button
        class="btn btn-green"
        onclick="saveTeacher()"
      >
        Save Teacher
      </button>
    `
  );

}


async function saveTeacher(){

  const row = {

    name:
      document.getElementById(
        "teacherName"
      ).value.trim(),

    subject:
      document.getElementById(
        "teacherSubject"
      ).value.trim() || null,

    qualification:
      document.getElementById(
        "teacherQualification"
      ).value.trim() || null,

    designation:
      document.getElementById(
        "teacherDesignation"
      ).value.trim() || null,

    photo_url:
      document.getElementById(
        "teacherPhoto"
      ).value.trim() || null

  };


  if(!row.name){

function addResultForm(){

  openModal(
    "Publish Exam Result",
    `
      <div class="form-grid">

        <input
          id="resultStudent"
          placeholder="Student ID"
        >

        <input
          id="resultExam"
          placeholder="Exam Name"
        >

        <input
          id="resultTotal"
          type="number"
          placeholder="Total Marks"
        >

        <input
          id="resultObtained"
          type="number"
          placeholder="Obtained Marks"
        >

        <input
          id="resultGrade"
          placeholder="Grade"
        >

        <input
          id="resultRank"
          type="number"
          placeholder="Rank"
        >

        <input
          id="resultDate"
          type="date"
        >

        <input
          id="resultAttendance"
          type="number"
          step="0.01"
          placeholder="Attendance %"
        >

        <textarea
          id="resultComment"
          placeholder="Teacher Comment"
          class="full"
        ></textarea>

      </div>

      <br>

      <button
        class="btn btn-green"
        onclick="saveResult()"
      >
        Publish Result
      </button>
    `
  );

}


async function saveResult(){

  const total =
    Number(
      document.getElementById(
        "resultTotal"
      ).value
    );

  const obtained =
    Number(
      document.getElementById(
        "resultObtained"
      ).value
    );

  const rank =
    document.getElementById(
      "resultRank"
    ).value.trim();

  const attendance =
    document.getElementById(
      "resultAttendance"
    ).value.trim();


  const row = {

    student_id:
      document.getElementById(
        "resultStudent"
      ).value.trim(),

    exam_name:
      document.getElementById(
        "resultExam"
      ).value.trim(),

    exam_date:
      document.getElementById(
        "resultDate"
      ).value || null,

    total_marks:
      total,

    obtained_marks:
      obtained,

    percentage:
      total > 0
        ? Number(
            (
              obtained /
              total *
              100
            ).toFixed(2)
          )
        : 0,

    grade:
      document.getElementById(
        "resultGrade"
      ).value.trim() || null,

    rank:
      rank === ""
        ? null
        : Number(rank),

    attendance:
      attendance === ""
        ? null
        : Number(attendance),

    teacher_comment:
      document.getElementById(
        "resultComment"
      ).value.trim() || null,

    published:
      true,

    subjects:
      []

  };


  if(
    !row.student_id ||
    !row.exam_name
  ){

    alert(
      "Student ID ও Exam Name দিন।"
    );

    return;
  }


  const {
    error
  } =
    await db
      .from("exam_results")
      .insert(row);


  if(error){

    alert(error.message);

    return;
  }


  closeModal();

  await resultsPage();

}


async function toggleResult(
  id,
  published
){

  const {
    error
  } =
    await db
      .from("exam_results")
      .update({
        published,
        updated_at:
          new Date().toISOString()
      })
      .eq("id",id);


  if(error){

    alert(error.message);

    return;
  }


  await resultsPage();

}

async function settingsPage(){

  const {

  document.getElementById(

  ).innerHTML = `

      <h2>
        ⚙️ Website Settings
      </h2>

      <div class="form-grid">

        <input
          id="siteName"
          value="${esc(
            data?.institution_name ||
            "The Unified Crew Learning Center"
          )}"
          placeholder="Institution Name"
        >

        <input
          id="sitePhone"
          value="${esc(
            data?.phone || ""
          )}"
          placeholder="Phone"
        >

        <input
          id="siteEmail"
          value="${esc(
            data?.email || ""
          )}"
          placeholder="Email"
        >

        <textarea
          id="siteTagline"
          class="full"
          placeholder="Website tagline"
        >${esc(
          data?.hero_subtitle || ""
        )}</textarea>

      </div>

      <br>

      <button
        class="btn btn-green"
        onclick="saveSettings()"
      >
        Save Settings
      </button>

    </div>

  `;

}


async function saveSettings(){

  const row = {

    institution_name:
      document.getElementById(
        "siteName"
      ).value.trim(),

    phone:
      document.getElementById(
        "sitePhone"
      ).value.trim(),

    email:
      document.getElementById(
        "siteEmail"
      ).value.trim(),

    hero_subtitle:
      document.getElementById(
        "siteTagline"
      ).value.trim(),

    updated_at:
      new Date().toISOString()

  };


  const {
    data: old
  } =
    await db
      .from("site_settings")
      .select("id")
      .limit(1)
      .maybeSingle();


  let result;


  if(old){

    result =
      await db
        .from("site_settings")
        .update(row)
        .eq(
          "id",
          old.id
        );

  }else{

    result =
      await db
        .from("site_settings")
        .insert(row);

  }


  if(result.error){

    alert(
      result.error.message
    );

    return;
  }


  alert(
    "Website Settings saved."
  );

}


/* =====================================================
   GENERIC DELETE
===================================================== */

async function deleteGeneric(
  table,
  id,
  reload
){

  if(
    !confirm(
      "আপনি কি সত্যিই Delete করতে চান?"
    )
  )
    return;


  const {
    error
  } =
    await db
      .from(table)
      .delete()
      .eq("id",id);


  if(error){

    alert(error.message);

    return;
  }


  await reload();

}


/* =====================================================
   MODAL
===================================================== */

function openModal(
  title,
  body
){

  document.getElementById(
    "modalTitle"
  ).textContent = title;

  document.getElementById(
    "modalBody"
  ).innerHTML = body;

  document.getElementById(
    "modal"
  ).style.display = "flex";

}


function closeModal(){

  document.getElementById(
    "modal"
  ).style.display = "none";

}


/* =====================================================
   SESSION
===================================================== */

async function checkSession(){

  const {
    data
  } =
    await db.auth.getSession();


  if(
    data.session &&
    data.session.user &&
    data.session.user.email.toLowerCase()
      === ADMIN_EMAIL.toLowerCase()
  ){

    document.getElementById(
      "loginScreen"
    ).style.display = "none";


    document.getElementById(
      "adminApp"
    ).style.display = "block";


    openTab("dashboard");

  }

}


checkSession();
