ns:repeat(3,1fr);gap:12px}.bulkActions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.bulkTable{width:100%;min-width:1200px;border-collapse:collapse}.bulkTable th,.bulkTable td{padding:9px;border-bottom:1px solid #e5edf2;text-align:left;vertical-align:middle}.bulkTable input,.bulkTable select{width:100%;box-sizing:border-box;padding:8px;border:1px solid #d6e3ea;border-radius:8px;font:inherit}.bulkHint{padding:10px 12px;border-radius:10px;background:#effaff;color:#0b577d;font-size:13px}.bulkError{color:#b42318;font-size:13px}.bulkOk{color:#08783b;font-size:13px}.orange{background:#e78b00;color:#fff}.status{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}.pending{background:#fff4cc;color:#8a6500}.accepted{background:#dff7e8;color:#08783b}.cancelled{background:#fee2e2;color:#b42318}.modal{display:none;position:fixed;inset:0;z-index:9999;background:#071b2dcc;align-items:center;justify-content:center;padding:16px}.modalBox{width:min(780px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px;padding:24px}.modalHead{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:15px}.close{border:0;width:38px;height:38px;border-radius:10px;background:#fee2e2;color:#b42318;font-size:23px;cursor:pointer}.photoPreview{width:110px;height:110px;object-fit:cover;border-radius:50%;background:#effaff}.galleryPreview{width:100%;height:180px;object-fit:cover;border-radius:12px}.galleryGridAdmin{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.galleryAdminCard{border:1px solid #e2ebf0;padding:10px;border-radius:14px;background:#fff}.muted{color:#64748b;font-size:13px}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.formGrid,.bulkGrid{grid-template-columns:1fr}.galleryGridAdmin{grid-template-columns:1fr 1fr}}@media(max-width:520px){.stats{grid-template-columns:1fr}.galleryGridAdmin{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}}

<script>
const SUPABASE_URL='https://wdiiftvtmtvsokdgyqmr.supabase.co';const SUPABASE_KEY='sb_publishable_RphPgkyVKZkZeIgklmt8hQ__W3aGPiX';const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const ADMIN_EMAIL='crewtheunified@gmail.com';
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function openModal(title,html){modalTitle.textContent=title;modalBody.innerHTML=html;document.getElementById('modal').style.display='flex'}function closeModal(){document.getElementById('modal').style.display='none'}
async function login(){loginError.textContent='';const {data,error}=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){loginError.textContent=error.message;return}if(!data.user||data.user.email.toLowerCase()!==ADMIN_EMAIL){await db.auth.signOut();loginError.textContent='এই account-এর Admin permission নেই।';return}loginScreen.style.display='none';adminApp.style.display='block';openTab('dashboard')}
async function logout(){await db.auth.signOut();adminApp.style.display='none';loginScreen.style.display='grid';password.value=''}
function openTab(type,button){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));if(button)button.classList.add('active');({dashboard:dashboardPage,students:studentsPage,teachers:teachersPage,results:resultsPage,admissions:admissionsPage,notices:noticesPage,gallery:galleryPage,settings:settingsPage}[type]||dashboardPage)()}
async function dashboardPage(){const [s,t,r,a,n,g]=await Promise.all([db.from('students').select('id'),db.from('teachers').select('id'),db.from('exam_results').select('id'),db.from('admissions').select('id').eq('status','pending'),db.from('notices').select('id').eq('published',true),db.from('gallery_images').select('id')]);content.innerHTML=`<div class="box"><h2>Welcome TUCLC Admin 👋</h2><p class="muted">সব online content এখান থেকে পরিচালনা করুন।</p></div><div class="stats"><div class="stat"><b>${(s.data||[]).length}</b><span>Students</span></div><div class="stat"><b>${(t.data||[]).length}</b><span>Teachers</span></div><div class="stat"><b>${(r.data||[]).length}</b><span>Results</span></div><div class="stat"><b>${(a.data||[]).length}</b><span>Pending Admissions</span></div></div>`}
async function studentsPage(){const {data,error}=await db.from('students').select('*').order('created_at',{ascending:false});if(error)return alert(error.message);content.innerHTML=`<div class="box"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><h2 style="margin:0">👨‍🎓 Students</h2><div class="muted">Class, Roll, বিভাগ/Batch সহ সম্পূর্ণ student management</div></div><button class="btn2 blue" onclick="studentForm()">+ Add Student</button></div></div><div class="box tableWrap"><table class="dataTable"><thead><tr><th>Name</th><th>ID</th><th>Class</th><th>Roll</th><th>বিভাগ / Batch</th><th>Guardian</th><th>Phone</th><th>Admission</th><th>Action</th></tr></thead><tbody>${(data||[]).map(s=>`<tr><td><strong>${esc(s.name)}</strong></td><td>${esc(s.student_id)}</td><td>${esc(s.class_name||'—')}</td><td>${esc(s.roll||'—')}</td><td>${esc(s.batch||'—')}</td><td>${esc(s.guardian_name||'—')}</td><td>${esc(s.guardian_phone||'—')}</td><td>${esc(s.admission_date||'—')}</td><td><div class="actions"><button class="btn2 blue" onclick="editStudent('${s.id}')">Edit</button><button class="btn2 red2" onclick="deleteRow('students','${s.id}',studentsPage)">Delete</button></div></td></tr>`).join('')}</tbody></table></div>`}
function studentForm(){openModal('Add Student',`<div class="formGrid"><input id="sName" placeholder="শিক্ষার্থীর নাম"><input id="sId" placeholder="Student ID"><input id="sClass" placeholder="Class"><input id="sRoll" placeholder="Roll"><input id="sBatch" placeholder="বিভাগ / Batch"><input id="sGuardian" placeholder="Guardian Name"><input id="sPhone" placeholder="Guardian Phone"><input id="sDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><br><button class="btn2 green" onclick="saveStudent()">Save Student</button>`)}
async function saveStudent(){const row={name:sName.value.trim(),student_id:sId.value.trim(),class_name:sClass.value.trim()||null,roll:sRoll.value.trim()||null,batch:sBatch.value.trim()||null,guardian_name:sGuardian.value.trim()||null,guardian_phone:sPhone.value.trim()||null,admission_date:sDate.value||null};if(!row.name||!row.student_id)return alert('Name ও Student ID দিন।');const {error}=await db.from('students').insert(row);if(error)return alert(error.message);closeModal();studentsPage()}
async function editStudent(id){const {data,error}=await db.from('students').select('*').eq('id',id).single();if(error)return alert(error.message);openModal('Edit Student',`<div class="formGrid"><input id="sName" value="${esc(data.name)}"><input id="sId" value="${esc(data.student_id)}"><input id="sClass" value="${esc(data.class_name||'')}"><input id="sRoll" value="${esc(data.roll||'')}"><input id="sBatch" value="${esc(data.batch||'')}"><input id="sGuardian" value="${esc(data.guardian_name||'')}"><input id="sPhone" value="${esc(data.guardian_phone||'')}"><input id="sDate" type="date" value="${esc(data.admission_date||'')}"></div><br><button class="btn2 green" onclick="updateStudent('${id}')">Update Student</button>`)}
async function updateStudent(id){const row={name:sName.value.trim(),student_id:sId.value.trim(),class_name:sClass.value.trim()||null,roll:sRoll.value.trim()||null,batch:sBatch.value.trim()||null,guardian_name:sGuardian.value.trim()||null,guardian_phone:sPhone.value.trim()||null,admission_date:sDate.value||null,updated_at:new Date().toISOString()};const {error}=await db.from('students').update(row).eq('id',id);if(error)return alert(error.message);closeModal();studentsPage()}
async function teachersPage(){const {data,error}=await db.from('teachers').select('*').order('created_at',{ascending:false});if(error)return alert(error.message);content.innerHTML=`<div class="box"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><h2 style="margin:0">👨‍🏫 Teachers</h2><div class="muted">JPG/PNG ছবি সরাসরি desktop/mobile থেকে upload করুন</div></div><button class="btn2 blue" onclick="teacherForm()">+ Add Teacher</button></div></div><div class="box tableWrap"><table class="dataTable"><thead><tr><th>Photo</th><th>Name</th><th>Subject</th><th>Designation</th><th>Qualification</th><th>Action</th></tr></thead><tbody>${(data||[]).map(t=>`<tr><td>${t.photo_url?`<img src="${esc(t.photo_url)}" class="photoPreview">`:'👨‍🏫'}</td><td><strong>${esc(t.name)}</strong></td><td>${esc(t.subject||'—')}</td><td>${esc(t.designation||'—')}</td><td>${esc(t.qualification||'—')}</td><td><div class="actions"><button class="btn2 blue" onclick="editTeacher('${t.id}')">Edit</button><button class="btn2 red2" onclick="deleteRow('teachers','${t.id}',teachersPage)">Delete</button></div></td></tr>`).join('')}</tbody></table></div>`}
function teacherForm(data={}){openModal(data.id?'Edit Teacher':'Add Teacher',`<div class="formGrid"><input id="tName" placeholder="Teacher Name" value="${esc(data.name||'')}"><input id="tSubject" placeholder="Subject" value="${esc(data.subject||'')}"><input id="tDesignation" placeholder="Designation" value="${esc(data.designation||'')}"><input id="tQualification" placeholder="Qualification" value="${esc(data.qualification||'')}"><textarea id="tBio" class="full" placeholder="Short Bio">${esc(data.bio||'')}</textarea><div class="full"><label><b>Teacher Photo (JPG/PNG, max 2MB)</b></label><input id="tPhoto" type="file" accept="image/jpeg,image/png"></div>${data.photo_url?`<div class="full"><img src="${esc(data.photo_url)}" class="photoPreview"><input type="hidden" id="tExistingPhoto" value="${esc(data.photo_url)}"></div>`:''}</div><br><button class="btn2 green" onclick="saveTeacher(${data.id?`'${data.id}'`:null})">Save Teacher</button>`)}
async function saveTeacher(id=null){const file=tPhoto.files[0];let photoUrl=document.getElementById('tExistingPhoto')?.value||null;if(file){if(file.size>2097152)return alert('ছবির size 2MB-এর বেশি হতে পারবে না।');const ext=file.type==='image/png'?'png':'jpg';const path=`${crypto.randomUUID()}.${ext}`;const {error}=await db.storage.from('teacher_photos').upload(path,file,{contentType:file.type,upsert:false});if(error)return alert(error.message);photoUrl=db.storage.from('teacher_photos').getPublicUrl(path).data.publicUrl}const row={name:tName.value.trim(),subject:tSubject.value.trim()||null,designation:tDesignation.value.trim()||null,qualification:tQualification.value.trim()||null,bio:tBio.value.trim()||null,photo_url:photoUrl,updated_at:new Date().toISOString()};if(!row.name)return alert('Teacher name দিন।');const res=id?await db.from('teachers').update(row).eq('id',id):await db.from('teachers').insert(row);if(res.error)return alert(res.error.message);closeModal();teachersPage()}
async function editTeacher(id){const {data,error}=await db.from('teachers').select('*').eq('id',id).single();if(error)return alert(error.message);teacherForm(data)}
async function resultsPage(){
  const {data,error}=await db.from('exam_results').select('*').order('created_at',{ascending:false});
  if(error)return alert(error.message);

  content.innerHTML=`
  <div class="box">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <div>
        <h2 style="margin:0">📊 Exam Result</h2>
        <div class="muted">একজনের result অথবা পুরো class-এর result একসাথে publish করুন।</div>
      </div>
      <div class="actions">
        <button class="btn2 blue" onclick="resultForm()">+ Single Result</button>
        <button class="btn2 orange" onclick="bulkResultForm()">📚 Publish Class Result</button>
      </div>
    </div>
  </div>

  <div class="box tableWrap">
    <table class="dataTable">
      <thead>
        <tr>
          <th>Student ID</th><th>Exam</th><th>Total</th><th>Obtained</th><th>%</th><th>Grade</th><th>Rank</th><th>Status</th><th>Action</th>
        </tr>
      </thead>
      <tbody>
        ${(data||[]).map(r=>`<tr>
          <td>${esc(r.student_id)}</td><td>${esc(r.exam_name)}</td><td>${esc(r.total_marks??'—')}</td><td>${esc(r.obtained_marks??'—')}</td>
          <td>${esc(r.percentage??'—')}%</td><td>${esc(r.grade??'—')}</td><td>${esc(r.rank??'—')}</td>
          <td><span class="status ${r.published?'accepted':'cancelled'}">${r.published?'Published':'Hidden'}</span></td>
          <td><div class="actions"><button class="btn2 green" onclick="toggleResult('${r.id}',${!r.published})">${r.published?'Unpublish':'Publish'}</button><button class="btn2 red2" onclick="deleteRow('exam_results','${r.id}',resultsPage)">Delete</button></div></td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}

function resultForm(){
  openModal('Add / Publish Exam Result',`
    <div class="formGrid">
      <input id="rStudent" placeholder="Student ID">
      <input id="rExam" placeholder="Exam Name">
      <input id="rDate" type="date">
      <input id="rTotal" type="number" placeholder="Total Marks">
      <input id="rObtained" type="number" placeholder="Obtained Marks">
      <input id="rGrade" placeholder="Grade">
      <input id="rRank" type="number" placeholder="Rank">
      <input id="rAttendance" type="number" step="0.01" placeholder="Attendance %">
      <textarea id="rComment" class="full" placeholder="Teacher Comment"></textarea>
      <textarea id="rSubjects" class="full" placeholder='Subjects JSON e.g. [{"subject":"Bangla","full":100,"mark":80}]'>[]</textarea>
    </div>
    <br><button class="btn2 green" onclick="saveResult()">Publish Result</button>`);
}

async function saveResult(){
  let subjects=[];
  try{subjects=JSON.parse(rSubjects.value||'[]')}catch(e){return alert('Subjects JSON সঠিক নয়।')}
  const total=Number(rTotal.value||0),obtained=Number(rObtained.value||0);
  const row={
    student_id:rStudent.value.trim(),exam_name:rExam.value.trim(),exam_date:rDate.value||null,subjects,
    total_marks:total,obtained_marks:obtained,percentage:total?Number((obtained/total*100).toFixed(2)):0,
    grade:rGrade.value.trim()||null,rank:rRank.value?Number(rRank.value):null,attendance:rAttendance.value?Number(rAttendance.value):null,
    teacher_comment:rComment.value.trim()||null,published:true
  };
  if(!row.student_id||!row.exam_name)return alert('Student ID ও Exam Name দিন।');
  const {error}=await db.from('exam_results').insert(row);
  if(error)return alert(error.message);
  closeModal();resultsPage();
}

async function bulkResultForm(){
  openModal('📚 Publish Class Result',`
    <div class="bulkGrid">
      <div><label><b>Class</b></label><select id="bulkClass"><option value="">Class নির্বাচন করুন</option><option>Play</option><option>Nursery</option><option>Class One</option><option>Class Two</option><option>Class Three</option><option>Class Four</option><option>Class Five</option><option>Class Six</option><option>Class Seven</option><option>Class Eight</option></select></div>
      <div><label><b>Exam Name</b></label><input id="bulkExam" placeholder="Half Yearly Examination"></div>
      <div><label><b>Exam Date</b></label><input id="bulkDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
    </div>
    <br>
    <div class="bulkActions">
      <button class="btn2 blue" onclick="loadBulkStudents()">Load Class Students</button>
      <button class="btn2 gray" onclick="downloadResultTemplate()">⬇️ CSV Template</button>
      <label class="btn2 gray" style="display:inline-flex;align-items:center;gap:6px;cursor:pointer">📤 Upload CSV <input id="bulkCsvFile" type="file" accept=".csv,text/csv" style="display:none" onchange="importBulkCsv(event)"></label>
    </div>
    <p class="bulkHint">প্রথমে Class ও Exam Name দিন। তারপর students load করুন। Total/Obtained বসালে Percentage নিজে হিসাব হবে। Rank ফাঁকা রাখা যাবে।</p>
    <div id="bulkResultArea"></div>`);
}

async function loadBulkStudents(){
  const className=bulkClass.value.trim(), examName=bulkExam.value.trim();
  if(!className||!examName)return alert('Class ও Exam Name দিন।');
  const {data,error}=await db.from('students').select('student_id,name,roll,batch,class_name').eq('class_name',className).order('roll',{ascending:true,nullsFirst:false}).order('name',{ascending:true});
  if(error)return alert(error.message);
  const students=data||[];
  if(!students.length){
    bulkResultArea.innerHTML='<div class="bulkHint">এই class-এ কোনো student পাওয়া যায়নি।</div>';return;
  }
  renderBulkRows(students,{});
}

function renderBulkRows(students,prefill){
  bulkResultArea.innerHTML=`
    <div class="bulkHint" style="margin:12px 0">মোট ${students.length} জন student। নিচে marks বসান। তারপর <b>Publish All</b> চাপুন।</div>
    <div class="tableWrap">
      <table class="bulkTable">
        <thead><tr><th>#</th><th>Student</th><th>ID</th><th>Roll</th><th>Total</th><th>Obtained</th><th>%</th><th>Grade</th><th>Rank</th><th>Attendance</th><th>Comment</th></tr></thead>
        <tbody>
          ${students.map((s,i)=>{
            const v=prefill[s.student_id]||{};
            return `<tr data-sid="${esc(s.student_id)}">
              <td>${i+1}</td><td><strong>${esc(s.name)}</strong></td><td>${esc(s.student_id)}</td><td>${esc(s.roll||'—')}</td>
              <td><input class="bTotal" type="number" value="${esc(v.total??'')}" placeholder="100"></td>
              <td><input class="bObtained" type="number" value="${esc(v.obtained??'')}" placeholder="0"></td>
              <td><input class="bPercentage" type="number" step="0.01" value="${esc(v.percentage??'')}" readonly></td>
              <td><input class="bGrade" value="${esc(v.grade??'')}" placeholder="A+"></td>
              <td><input class="bRank" type="number" value="${esc(v.rank??'')}" placeholder="—"></td>
              <td><input class="bAttendance" type="number" step="0.01" value="${esc(v.attendance??'')}" placeholder="100"></td>
              <td><input class="bComment" value="${esc(v.comment??'')}" placeholder="Comment"></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
    <br><div class="bulkActions"><button class="btn2 green" onclick="publishBulkResults()">✅ Publish All ${students.length} Results</button><span id="bulkStatus" class="muted"></span></div>`;

  document.querySelectorAll('#bulkResultArea tr[data-sid]').forEach(row=>{
    const total=row.querySelector('.bTotal'),obt=row.querySelector('.bObtained'),pct=row.querySelector('.bPercentage');
    const calc=()=>{const t=Number(total.value||0),o=Number(obt.value||0);pct.value=t>0?((o/t)*100).toFixed(2):''};
    total.addEventListener('input',calc);obt.addEventListener('input',calc);calc();
  });
}

function parseCsvLine(line){
  const out=[];let cur='';let quote=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"' && line[i+1]==='"'){cur+='"';i++;continue;}
    if(ch==='"'){quote=!quote;continue;}
    if(ch===','&&!quote){out.push(cur.trim());cur='';continue;}
    cur+=ch;
  }
  out.push(cur.trim());return out;
}

async function importBulkCsv(event){
  const file=event.target.files?.[0];
  if(!file)return;
  const text=await file.text();
  const lines=text.split(/\r?\n/).filter(x=>x.trim());
  if(lines.length<2)return alert('CSV-তে data নেই।');
  const headers=parseCsvLine(lines[0]).map(h=>h.toLowerCase());
  const required=['student_id','total_marks','obtained_marks'];
  if(!required.every(h=>headers.includes(h)))return alert('CSV header-এ student_id,total_marks,obtained_marks থাকতে হবে।');
  const index={};headers.forEach((h,i)=>index[h]=i);
  const prefill={};
  lines.slice(1).forEach(line=>{
    const c=parseCsvLine(line),sid=(c[index.student_id]||'').trim();if(!sid)return;
    prefill[sid]={total:c[index.total_marks]||'',obtained:c[index.obtained_marks]||'',grade:index.grade!==undefined?(c[index.grade]||''):'',rank:index.rank!==undefined?(c[index.rank]||''):'',attendance:index.attendance!==undefined?(c[index.attendance]||''):'',comment:index.teacher_comment!==undefined?(c[index.teacher_comment]||''):''};
  });
  const className=bulkClass.value.trim();
  if(!className)return alert('CSV import-এর আগে Class নির্বাচন করুন।');
  const {data,error}=await db.from('students').select('student_id,name,roll,batch,class_name').eq('class_name',className).order('roll',{ascending:true,nullsFirst:false}).order('name',{ascending:true});
  if(error)return alert(error.message);
  const students=data||[];
  if(!students.length)return alert('এই class-এ কোনো student নেই।');
  renderBulkRows(students,prefill);
}

async function publishBulkResults(){
  const examName=bulkExam.value.trim(),examDate=bulkDate.value||null;
  if(!examName)return alert('Exam Name দিন।');
  const rows=[...document.querySelectorAll('#bulkResultArea tr[data-sid]')].map(row=>{
    const total=Number(row.querySelector('.bTotal').value||0),obt=Number(row.querySelector('.bObtained').value||0);return{
      student_id:row.dataset.sid,exam_name:examName,exam_date:examDate,subjects:[],total_marks:total,obtained_marks:obt,
      percentage:total?Number((obt/total*100).toFixed(2)):0,grade:row.querySelector('.bGrade').value.trim()||null,rank:row.querySelector('.bRank').value?Number(row.querySelector('.bRank').value):null,
      attendance:row.querySelector('.bAttendance').value?Number(row.querySelector('.bAttendance').value):null,teacher_comment:row.querySelector('.bComment').value.trim()||null,published:true
    };
  });
  if(!rows.length)return alert('Student list load করুন।');
  const invalid=rows.find(r=>!r.student_id||!r.exam_name||!Number.isFinite(r.total_marks)||r.total_marks<=0||r.obtained_marks<0||r.obtained_marks>r.total_marks);
  if(invalid)return alert(`Student ${invalid.student_id}: Total/Obtained marks সঠিকভাবে দিন।`);
  const status=document.getElementById('bulkStatus');if(status)status.textContent='Publishing...';
  let done=0;
  for(const row of rows){
    const {data:existing,error:findError}=await db.from('exam_results').select('id').eq('student_id',row.student_id).eq('exam_name',row.exam_name).eq('exam_date',row.exam_date).maybeSingle();
    if(findError){if(status)status.textContent='Error';return alert(findError.message)}
    const res=existing?await db.from('exam_results').update({...row,updated_at:new Date().toISOString()}).eq('id',existing.id):await db.from('exam_results').insert(row);
    if(res.error){if(status)status.textContent='Error';return alert(`${row.student_id}: ${res.error.message}`)}
    done++;
    if(status)status.textContent=`${done}/${rows.length} published...`;
  }
  if(status)status.textContent=`✅ ${done}টি result publish হয়েছে।`;
  alert(`পুরো class-এর ${done}টি result সফলভাবে publish হয়েছে।`);
  await resultsPage();
}

async function galleryPage(){const {data,error}=await db.from('gallery_images').select('*').order('event_date',{ascending:false}).order('created_at',{ascending:false});if(error)return alert(error.message);content.innerHTML=`<div class="box"><div style="display:flex;justify-content:space-between;align-items:center"><div><h2 style="margin:0">🖼️ Photo Gallery</h2><div class="muted">JPG/PNG upload • Event title • Caption • Date</div></div><button class="btn2 blue" onclick="galleryForm()">+ Add Photo</button></div></div><div class="box"><div class="galleryGridAdmin">${(data||[]).map(g=>`<div class="galleryAdminCard"><img src="${esc(g.image_url)}" class="galleryPreview"><h3>${esc(g.title)}</h3><p class="muted">${esc(g.caption||'')}</p><button class="btn2 red2" onclick="deleteGallery('${g.id}','${esc(g.image_url)}')">Delete</button></div>`).join('')}</div></div>`}

async function saveGallery(){const file=gFile.files[0];if(!file)return alert('একটি JPG/PNG ছবি নির্বাচন করুন।');if(file.size>5242880)return alert('ছবির size 5MB-এর বেশি হতে পারবে না।');const path=`${crypto.randomUUID()}.${file.type==='image/png'?'png':'jpg'}`;const {error:uploadError}=await db.storage.from('gallery').upload(path,file,{contentType:file.type,upsert:false});if(uploadError)return alert(uploadError.message);const imageUrl=db.storage.from('gallery').getPublicUrl(path).data.publicUrl;const {error}=await db.from('gallery_images').insert({title:gTitle.value.trim()||'TUCLC Event',caption:gCaption.value.trim()||null,event_date:gDate.value||null,image_url:imageUrl});if(error)return alert(error.message);closeModal();galleryPage()}
