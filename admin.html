<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TUCLC Admin Panel</title><link rel="icon" href="assets/logo.png"><link rel="stylesheet" href="style.css"><style>body{background:#f5fbfe}.panel{max-width:1150px;margin:35px auto}.bar{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:18px 22px;border-radius:18px;box-shadow:0 8px 25px #0001}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab{border:1px solid #dce8ee;background:#fff;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:700}.tab.active{background:#087fbe;color:#fff}.box{background:#fff;padding:22px;border-radius:18px;margin-bottom:18px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.formgrid input,.formgrid textarea,.formgrid select{padding:11px;border:1px solid #d7e4ea;border-radius:9px;font:inherit}.formgrid textarea{grid-column:1/-1}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e6eef2;text-align:left;font-size:14px}.danger{background:#d82732;color:white}.login{max-width:430px;margin:12vh auto;background:white;padding:30px;border-radius:22px;box-shadow:0 15px 45px #07507818}.login img{width:110px;display:block;margin:auto}.login input{width:100%;padding:13px;margin:7px 0;border:1px solid #d6e2e8;border-radius:10px;font:inherit}@media(max-width:700px){.formgrid{grid-template-columns:1fr}.formgrid textarea{grid-column:auto}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div id="login" class="login"><img src="assets/logo.png"><h2>🔐 TUCLC Admin Login</h2><p>শুধু অনুমোদিত Admin account ব্যবহার করুন।</p><input id="email" type="email" value="crewtheunified@gmail.com"><input id="password" type="password" placeholder="Password"><button class="btn red" style="width:100%" onclick="login()">Login</button><p id="msg"></p></div><div id="app" class="panel" hidden><div class="bar"><div><b>TUCLC Admin Panel</b><small style="display:block;color:#6b7d8b">Supabase Online Database</small></div><button class="btn red" onclick="logout()">Logout</button></div><div class="tabs"><button class="tab active" onclick="show('students',this)">Students</button><button class="tab" onclick="show('teachers',this)">Teachers</button><button class="tab" onclick="show('results',this)">Exam Result</button><button class="tab" onclick="show('notices',this)">Notices</button><button class="tab" onclick="show('admissions',this)">Admissions</button><button class="tab" onclick="show('settings',this)">Settings</button></div><div id="content"></div></div><script src="admin.js"></script></body></html>
