<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>TUCLC Admin Panel</title>

  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body{
      background:#f5fbfe;
    }

    .panel{
      max-width:1200px;
      margin:35px auto;
      padding:0 15px 50px;
    }

    .bar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:15px;
      background:#fff;
      padding:18px 22px;
      border-radius:18px;
      box-shadow:0 8px 25px #0001;
    }

    .tabs{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin:18px 0;
    }

    .tab{
      border:1px solid #dce8ee;
      background:#fff;
      padding:10px 14px;
      border-radius:10px;
      cursor:pointer;
      font-weight:700;
    }

    .tab.active{
      background:#087fbe;
      color:#fff;
    }

    .box{
      background:#fff;
      padding:22px;
      border-radius:18px;
      margin-bottom:18px;
      box-shadow:0 5px 20px #00000008;
    }

    .formgrid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:12px;
    }

    .formgrid input,
    .formgrid textarea,
    .formgrid select{
      width:100%;
      padding:11px 12px;
      border:1px solid #d7e4ea;
      border-radius:9px;
      font:inherit;
      box-sizing:border-box;
      background:#fff;
    }

    .formgrid textarea{
      grid-column:1/-1;
      min-height:90px;
      resize:vertical;
    }

    .full{
      grid-column:1/-1;
    }

    .tablewrap{
      overflow:auto;
    }

    table{
      width:100%;
      border-collapse:collapse;
      min-width:850px;
    }

    th,td{
      padding:11px;
      border-bottom:1px solid #e6eef2;
      text-align:left;
      font-size:14px;
      vertical-align:middle;
    }

    th{
      background:#f5fbff;
      color:#10213b;
    }

    .danger{
      background:#d82732!important;
      color:white!important;
    }

    .success{
      background:#079447!important;
      color:white!important;
    }

    .muted{
      color:#6b7d8b;
      font-size:13px;
    }

    .login{
      max-width:430px;
      margin:12vh auto;
      background:white;
      padding:30px;
      border-radius:22px;
      box-shadow:0 15px 45px #07507818;
      text-align:center;
    }

    .login img{
      width:110px;
      height:110px;
      object-fit:contain;
      display:block;
      margin:auto;
    }

    .login input{
      width:100%;
      padding:13px;
      margin:7px 0;
      border:1px solid #d6e2e8;
      border-radius:10px;
      font:inherit;
      box-sizing:border-box;
    }

    .msg{
      min-height:24px;
      color:#d82732;
      margin-top:10px;
    }

    .modalBackdrop{
      display:none;
      position:fixed;
      inset:0;
      background:#071b2dcc;
      z-index:9999;
      align-items:center;
      justify-content:center;
      padding:18px;
    }

    .modalBox{
      width:min(760px,100%);
      max-height:90vh;
      overflow:auto;
      background:#fff;
      border-radius:20px;
      padding:24px;
    }

    .modalTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:15px;
      margin-bottom:18px;
    }

    .close{
      border:0;
      background:#fee2e2;
      color:#d82732;
      border-radius:9px;
      width:38px;
      height:38px;
      font-size:22px;
      cursor:pointer;
    }

    .actionRow{
      display:flex;
      gap:7px;
      flex-wrap:wrap;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:15px;
    }

    .statCard{
      background:linear-gradient(135deg,#fff,#eefaff);
      border:1px solid #e3edf5;
      border-radius:16px;
      padding:20px;
    }

    .statCard h3{
      margin:0;
      font-size:30px;
      color:#087fc1;
    }

    .noticeBody{
      white-space:pre-wrap;
    }

    @media(max-width:700px){
      .formgrid{
        grid-template-columns:1fr;
      }

      .formgrid textarea,
      .full{
        grid-column:auto;
      }

      .stats{
        grid-template-columns:1fr;
      }

      .bar{
        align-items:flex-start;
        flex-direction:column;
      }
    }
  </style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<div id="login" class="login">

  <img src="assets/logo.png" alt="TUCLC">

  <h2>🔐 TUCLC Admin Login</h2>

  <p>
    শুধু অনুমোদিত Admin account ব্যবহার করুন।
  </p>

  <input
    id="email"
    type="email"
    value="crewtheunified@gmail.com"
    placeholder="Admin Email"
  >

  <input
    id="password"
    type="password"
    placeholder="Password"
  >

  <button
    class="btn red"
    style="width:100%"
    onclick="login()"
  >
    Login
  </button>

  <div id="msg" class="msg"></div>

</div>


<!-- =========================
     ADMIN APP
========================= -->

<div id="app" class="panel" hidden>

  <div class="bar">

    <div>
      <b style="font-size:18px">
        🛠️ TUCLC Admin Panel
      </b>

      <small
        style="display:block;color:#6b7d8b"
      >
        Supabase Online Database
      </small>
    </div>

    <button
      class="btn red"
      onclick="logout()"
    >
      Logout
    </button>

  </div>


  <!-- TABS -->

  <div class="tabs">

    <button
      class="tab active"
      onclick="show('dashboard',this)"
    >
      Dashboard
    </button>

    <button
      class="tab"
      onclick="show('students',this)"
    >
      Students
    </button>

    <button
      class="tab"
      onclick="show('teachers',this)"
    >
      Teachers
    </button>

    <button
      class="tab"
      onclick="show('results',this)"
    >
      Exam Result
    </button>

    <button
      class="tab"
      onclick="show('notices',this)"
    >
      Notices
    </button>

    <button
      class="tab"
      onclick="show('admissions',this)"
    >
      Admissions
    </button>

    <button
      class="tab"
      onclick="show('settings',this)"
    >
      Settings
    </button>

  </div>


  <div id="content"></div>

</div>


<!-- =========================
     MODAL
========================= -->

<div id="modalBackdrop" class="modalBackdrop">

  <div class="modalBox">

    <div class="modalTop">

      <h2 id="modalTitle">
        Form
      </h2>

      <button
        class="close"
        onclick="closeModal()"
      >
        ×
      </button>

    </div>

    <div id="modalContent"></div>

  </div>

</div>


<script>

/* ==================================================
   SUPABASE
================================================== */

const SUPABASE_URL =
  "https://wdiiftvtmtvsokdgyqmr.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_RphPgkyVKZkZeIgklmt8hQ__W3aGPiX";

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const ADMIN_EMAIL =
  "crewtheunified@gmail.com";


/* ==================================================
   HELPERS
================================================== */

const esc = (v) =>
  String(v ?? "").replace(
    /[&<>"']/g,
    (m) => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m])
  );


function msg(text){

  const el =
    document.getElementById("msg");

  if(!el) return;

  el.textContent =
    text;

}


/* ==================================================
   MODAL
================================================== */

function openModal(title, html){

  document.getElementById(
    "modalTitle"
  ).textContent = title;

  document.getElementById(
    "modalContent"
  ).innerHTML = html;

  document.getElementById(
    "modalBackdrop"
  ).style.display = "flex";

}


function closeModal(){

  document.getElementById(
    "modalBackdrop"
  ).style.display = "none";

}


/* ==================================================
   LOGIN
================================================== */

async function login(){

  const email =
    document.getElementById(
      "email"
    ).value.trim();

  const password =
    document.getElementById(
      "password"
    ).value;

  if(!email || !password){

    msg(
      "Email ও Password দিন।"
    );

    return;
  }


  const {
    data,
    error
  } =
    await db.auth.signInWithPassword({

      email,
      password

    });


  if(error){

    msg(error.message);

    return;
  }


  if(
    data.user.email.toLowerCase() !==
    ADMIN_EMAIL.toLowerCase()
  ){

    await db.auth.signOut();

    msg(
      "এই account-এর Admin permission নেই।"
    );

    return;
  }


  document.getElementById(
    "login"
  ).hidden = true;

  document.getElementById(
    "app"
  ).hidden = false;


  show("dashboard");

}


async function logout(){

  await db.auth.signOut();

  document.getElementById(
    "app"
  ).hidden = true;

  document.getElementById(
    "login"
  ).hidden = false;

  document.getElementById(
    "password"
  ).value = "";

}


/* ==================================================
   NAVIGATION
================================================== */

function show(type, button){

  document
    .querySelectorAll(".tab")
    .forEach(
      x => x.classList.remove("active")
    );


  if(button)
    button.classList.add("active");


  if(type === "dashboard")
    dashboardPage();

  if(type === "students")
    studentsPage();

  if(type === "teachers")
    teachersPage();

  if(type === "results")
    resultsPage();

  if(type === "notices")
    noticesPage();

  if(type === "admissions")
    admissionsPage();

  if(type === "settings")
    settingsPage();

}


/* ==================================================
   DASHBOARD
================================================== */

async function dashboardPage(){

  const [
    students,
    teachers,
    results
  ] = await Promise.all([

    db
      .from("students")
      .select("id"),

    db
      .from("teachers")
      .select("id"),

    db
      .from("exam_results")
      .select("id")

  ]);


  document.getElementById(
    "content"
  ).innerHTML = `

    <div class="box">

      <h2>
        Welcome TUCLC Admin 👋
      </h2>

      <p class="muted">
        Real Online Database:
        Supabase PostgreSQL +
        Secure Authentication
      </p>

    </div>


    <div class="stats">

      <div class="statCard">

        <h3>
          ${(students.data || []).length}
        </h3>

        <p>
          Students
        </p>

      </div>


      <div class="statCard">

        <h3>
          ${(teachers.data || []).length}
        </h3>

        <p>
          Teachers
        </p>

      </div>


      <div class="statCard">

        <h3>
          ${(results.data || []).length}
        </h3>

        <p>
          Exam Results
        </p>

      </div>

    </div>

  `;

}


/* ==================================================
   STUDENTS
================================================== */

async function studentsPage(){

  const {
    data,
    error
  } =
    await db
      .from("students")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    msg(error.message);

    return;
  }


  document.getElementById(
    "content"
  ).innerHTML = `

    <div class="box">

      <div
        style="
          display:flex;
          justify-content:space-between;
          align-items:center;
          gap:10px;
          margin-bottom:15px;
        "
      >

        <div>

          <h2 style="margin:0">
            👨‍🎓 Students
          </h2>

          <div class="muted">
            Add / Edit Student information
          </div>

        </div>

        <button
          class="btn primary"
          onclick="studentForm()"
        >
          + Add Student
        </button>

      </div>


      <div class="tablewrap">

        <table>

          <thead>

            <tr>

              <th>
                নাম
              </th>

              <th>
                Student ID
              </th>

              <th>
                Class
              </th>

              <th>
                Roll
              </th>

              <th>
                বিভাগ / Batch
              </th>

              <th>
                Guardian
              </th>

              <th>
                Phone
              </th>

              <th>
                Action
              </th>

            </tr>

          </thead>


          <tbody>

            ${(data || []).map(
              x => `

              <tr>

                <td>
                  <strong>
                    ${esc(x.name)}
                  </strong>
                </td>

                <td>
                  ${esc(x.student_id)}
                </td>

                <td>
                  ${esc(x.class_name || "—")}
                </td>

                <td>
                  ${esc(x.roll ?? "—")}
                </td>

                <td>
                  ${esc(x.batch || "—")}
                </td>

                <td>
                  ${esc(x.guardian_name || "—")}
                </td>

                <td>
                  ${esc(x.guardian_phone || "—")}
                </td>

                <td>

                  <div class="actionRow">

                    <button
                      class="btn small primary"
                      onclick="editStudent('${x.id}')"
                    >
                      Edit
                    </button>

                    <button
                      class="btn small danger"
                      onclick="
                        deleteRow(
                          'students',
                          '${x.id}',
                          studentsPage
                        )
                      "
                    >
                      Delete
                    </button>

                  </div>

                </td>

              </tr>

            `
            ).join("")}

          </tbody>

        </table>

      </div>

    </div>

  `;

}


/* ==================================================
   ADD STUDENT
================================================== */

function studentForm(){

  openModal(

    "Add Student",

    `

      <div class="formgrid">

        <input
          id="fName"
          placeholder="শিক্ষার্থীর নাম"
        >

        <input
          id="fId"
          placeholder="Student ID"
        >

        <input
          id="fClass"
          placeholder="Class"
        >

        <input
          id="fRoll"
          type="number"
          placeholder="Roll"
        >

        <input
          id="fBatch"
          placeholder="বিভাগ / Batch"
        >

        <input
          id="fGuardian"
          placeholder="Guardian Name"
        >

        <input
          id="fPhone"
          placeholder="Guardian Phone"
        >

      </div>


      <br>

      <button
        class="btn success"
        onclick="saveStudent()"
      >
        Save Student
      </button>

    `

  );

}


/* ==================================================
   SAVE STUDENT
================================================== */

async function saveStudent(){

  const name =
    document.getElementById(
      "fName"
    ).value.trim();

  const student_id =
    document.getElementById(
      "fId"
    ).value.trim();

  const class_name =
    document.getElementById(
      "fClass"
    ).value.trim();

  const rollRaw =
    document.getElementById(
      "fRoll"
    ).value.trim();

  const batch =
    document.getElementById(
      "fBatch"
    ).value.trim();

  const guardian_name =
    document.getElementById(
      "fGuardian"
    ).value.trim();

  const guardian_phone =
    document.getElementById(
      "fPhone"
    ).value.trim();


  if(!name || !student_id){

    alert(
      "Student Name ও Student ID দিন।"
    );

    return;
  }


  const row = {

    name,

    student_id,

    class_name:
      class_name || null,

    roll:
      rollRaw === ""
        ? null
        : Number(rollRaw),

    batch:
      batch || null,

    guardian_name:
      guardian_name || null,

    guardian_phone:
      guardian_phone || null

  };


  const {
    error
  } =
    await db
      .from("students")
      .insert(row);


  if(error){

    alert(error.message);

    return;
  }


  closeModal();

  await studentsPage();

  alert(
    "Student successfully added."
  );

}


/* ==================================================
   EDIT STUDENT
================================================== */

async function editStudent(id){

  const {
    data,
    error
  } =
    await db
      .from("students")
      .select("*")
      .eq("id",id)
      .single();


  if(error){

    alert(error.message);

    return;
  }


  openModal(

    "Edit Student",

    `

      <div class="formgrid">

        <input
          id="fName"
          value="${esc(data.name)}"
          placeholder="শিক্ষার্থীর নাম"
        >

        <input
          id="fId"
          value="${esc(data.student_id)}"
          placeholder="Student ID"
        >

        <input
          id="fClass"
          value="${esc(data.class_name || "")}"
          placeholder="Class"
        >

        <input
          id="fRoll"
          type="number"
          value="${data.roll ?? ""}"
          placeholder="Roll"
        >

        <input
          id="fBatch"
          value="${esc(data.batch || "")}"
          placeholder="বিভাগ / Batch"
        >

        <input
          id="fGuardian"
          value="${esc(data.guardian_name || "")}"
          placeholder="Guardian Name"
        >

        <input
          id="fPhone"
          value="${esc(data.guardian_phone || "")}"
          placeholder="Guardian Phone"
        >

      </div>


      <br>

      <button
        class="btn success"
        onclick="updateStudent('${id}')"
      >
        Update Student
      </button>

    `

  );

}


/* ==================================================
   UPDATE STUDENT
================================================== */

async function updateStudent(id){

  const rollRaw =
    document.getElementById(
      "fRoll"
    ).value.trim();


  const row = {

    name:
      document.getElementById(
        "fName"
      ).value.trim(),

    student_id:
      document.getElementById(
        "fId"
      ).value.trim(),

    class_name:
      document.getElementById(
        "fClass"
      ).value.trim() || null,

    roll:
      rollRaw === ""
        ? null
        : Number(rollRaw),

    batch:
      document.getElementById(
        "fBatch"
      ).value.trim() || null,

    guardian_name:
      document.getElementById(
        "fGuardian"
      ).value.trim() || null,

    guardian_phone:
      document.getElementById(
        "fPhone"
      ).value.trim() || null,

    updated_at:
      new Date().toISOString()

  };


  const {
    error
  } =
    await db
      .from("students")
      .update(row)
      .eq("id",id);


  if(error){

    alert(error.message);

    return;
  }


  closeModal();

  await studentsPage();

}

   TEACHERS

          <tr>
            <th>Name</th>

            <th>Qualification</th>
            <th>Designation</th>
            <th>Action</th>
          </tr>

        </thead>


        <tbody>

          ${(data || []).map(
            x => `

            <tr>

              <td>
                ${esc(x.name)}
              </td>

              <td>
                ${esc(x.subject || "—")}
              </td>

              <td>
                ${esc(x.qualification || "—")}
              </td>

              <td>
                ${esc(x.designation || "—")}
              </td>

              <td>

                <button
                  class="btn small danger"
                  onclick="
                    deleteRow(
                      'teachers',
                      '${x.id}',

                    )

                >
                  Delete
                </button>

              </td>

            </tr>

          `
          ).join("")}

        </tbody>

      </table>

function teacherForm(){

  openModal(

    "Add Teacher",

    `

      <div class="formgrid">

        <input
          id="tName"
          placeholder="Teacher Name"
        >

        <input
          id="tSubject"
          placeholder="Subject"
        >

        <input
          id="tQualification"
          placeholder="Qualification"
        >

        <input
          id="tDesignation"
          placeholder="Designation"
        >

        <input
          id="tPhoto"
          placeholder="Photo URL"
        >

      </div>


      <br>

      <button
        class="btn success"
        onclick="saveTeacher()"
      >
        Save Teacher
      </button>

    `

  );

}


async function saveTeacher(){

  const row = {

    name:
      document.getElementById(
        "tName"
      ).value.trim(),

    subject:
      document.getElementById(
        "tSubject"
      ).value.trim() || null,

    qualification:
      document.getElementById(
        "tQualification"
      ).value.trim() || null,

    designation:
      document.getElementById(
        "tDesignation"
      ).value.trim() || null,

    photo_url:
      document.getElementById(
        "tPhoto"
      ).value.trim() || null

  };


  if(!row.name){

    alert(
      "Teacher name দিন।"
    );

    return;
  }


  const {
    error
  } =
    await db
      .from("teachers")
      .insert(row);


  if(error){

    alert(error.message);

    return;
  }


  closeModal();

  await teachersPage();

}


/* ==================================================
   RESULTS
================================================== */

async function resultsPage(){

  const {
    data,
    error
  } =
    await db
      .from("exam_results")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    msg(error.message);

    return;
  }


  document.getElementById(
    "content"
  ).innerHTML = `

    <div class="box">

      <h2>
        📊 Exam Result
      </h2>

      <button
        class="btn primary"
        onclick="resultForm()"
      >
        + Add Result
      </button>

    </div>


    <div class="box tablewrap">

      <table>

        <thead>

          <tr>

            <th>
              Student ID
            </th>

async function saveResult(){

  const total =
    Number(
      document.getElementById(
        "rTotal"
      ).value
    );


  const obtained =
    Number(
      document.getElementById(
        "rObtained"
      ).value
    );


  const percentageInput =
    document.getElementById(
      "rPercentage"
    ).value.trim();


  const percentage =
    percentageInput === ""
      ? (
          total > 0
            ? Number(
                (
                  obtained /
                  total *
                  100
                ).toFixed(2)
              )
            : 0
        )
      : Number(percentageInput);


  const rankInput =
    document.getElementById(
      "rRank"
    ).value.trim();


  const attendanceInput =
    document.getElementById(
      "rAttendance"
    ).value.trim();


  const row = {

    student_id:
      document.getElementById(
        "rStudent"
      ).value.trim(),

    exam_name:
      document.getElementById(
        "rExam"
      ).value.trim(),

    exam_date:
      document.getElementById(
        "rDate"
      ).value || null,

    total_marks:
      total,

    obtained_marks:
      obtained,

    percentage:
      percentage,

    grade:
      document.getElementById(
        "rGrade"
      ).value.trim() || null,

    rank:
      rankInput === ""
        ? null
        : Number(rankInput),

    attendance:
      attendanceInput === ""
        ? null
        : Number(attendanceInput),

    teacher_comment:
      document.getElementById(
        "rComment"
      ).value.trim() || null,

    subjects:
      [],

    published:
      true

  };


  if(
    !row.student_id ||
    !row.exam_name
  ){

    alert(
      "Student ID ও Exam Name দিন।"
    );

    return;
  }


  const {
    error
  } =
    await db
      .from("exam_results")
      .insert(row);


  if(error){

    alert(error.message);

    return;
  }


  closeModal();

  await resultsPage();

  alert(
    "Exam Result published successfully."
  );

}

async function saveSettings(){

  const row = {

    institution_name:
      document.getElementById(
        "setName"
      ).value.trim(),

    phone:
      document.getElementById(
        "setPhone"
      ).value.trim(),

    email:
      document.getElementById(
        "setEmail"
      ).value.trim(),

    hero_subtitle:
      document.getElementById(
        "setTag"
      ).value.trim(),

    updated_at:
      new Date().toISOString()

  };


  const {
    data: old
  } =
    await db
      .from("site_settings")
      .select("id")
      .limit(1)
      .maybeSingle();


  let result;


  if(old){

    result =
      await db
        .from("site_settings")
        .update(row)
        .eq(
          "id",
          old.id
        );

  }else{

    result =
      await db
        .from("site_settings")
        .insert(row);

  }


  if(result.error){

    alert(
      result.error.message
    );

    return;
  }


  alert(
    "Website settings saved."
  );

}

async function deleteRow(

  id,
  reloadFunction
){

  if(
    !confirm(
      "আপনি কি সত্যিই Delete করতে চান?"
    )
  )
    return;


  const {
    error
  } =
    await db
      .from(table)
      .delete()
      .eq(
        "id",
        id
      );


  if(error){

    alert(error.message);

    return;
  }


  await reloadFunction();

}

================================================== */

function show(type, button){

  document
    .querySelectorAll(".tab")
    .forEach(
      x => x.classList.remove("active")
    );


  if(button)
    button.classList.add("active");


  if(type === "dashboard")
    dashboardPage();

  if(type === "students")
    studentsPage();

  if(type === "teachers")
    teachersPage();

  if(type === "results")
    resultsPage();

  if(type === "notices")
    noticesPage();

  if(type === "admissions")
    admissionsPage();

  if(type === "settings")
    settingsPage();

}

async function saveStudent(){

  const name =
    document.getElementById(
      "fName"
    ).value.trim();

  const student_id =
    document.getElementById(
      "fId"
    ).value.trim();

  const class_name =
    document.getElementById(
      "fClass"
    ).value.trim();

  const rollRaw =
    document.getElementById(
      "fRoll"
    ).value.trim();

  const batch =
    document.getElementById(
      "fBatch"
    ).value.trim();

  const guardian_name =
    document.getElementById(
      "fGuardian"
    ).value.trim();

  const guardian_phone =
    document.getElementById(
      "fPhone"
    ).value.trim();


  if(!name || !student_id){

    alert(
      "Student Name ও Student ID দিন।"
    );

    return;
  }


  const row = {

    name,

    student_id,

    class_name:
      class_name || null,

    roll:
      rollRaw === ""
        ? null
        : Number(rollRaw),

    batch:
      batch || null,

    guardian_name:
      guardian_name || null,

    guardian_phone:
      guardian_phone || null

  };


  const {
    error
  } =
    await db
      .from("students")
      .insert(row);


  if(error){

    alert(error.message);

    return;
  }


  closeModal();

  await studentsPage();

  alert(
    "Student successfully added."
  );

}

async function saveResult(){

  const total =
    Number(
      document.getElementById(
        "rTotal"
      ).value
    );


  const obtained =
    Number(
      document.getElementById(
        "rObtained"
      ).value
    );


  const percentageInput =
    document.getElementById(
      "rPercentage"
    ).value.trim();


  const percentage =
    percentageInput === ""
      ? (
          total > 0
            ? Number(
                (
                  obtained /
                  total *
                  100
                ).toFixed(2)
              )
            : 0
        )
      : Number(percentageInput);


  const rankInput =
    document.getElementById(
      "rRank"
    ).value.trim();


  const attendanceInput =
    document.getElementById(
      "rAttendance"
    ).value.trim();


  const row = {

    student_id:
      document.getElementById(
        "rStudent"
      ).value.trim(),

    exam_name:
      document.getElementById(
        "rExam"
      ).value.trim(),

    exam_date:
      document.getElementById(
        "rDate"
      ).value || null,

    total_marks:
      total,

    obtained_marks:
      obtained,

    percentage:
      percentage,

    grade:
      document.getElementById(
        "rGrade"
      ).value.trim() || null,

    rank:
      rankInput === ""
        ? null
        : Number(rankInput),

    attendance:
      attendanceInput === ""
        ? null
        : Number(attendanceInput),

    teacher_comment:
      document.getElementById(
        "rComment"
      ).value.trim() || null,

    subjects:
      [],

    published:
      true

  };


  if(
    !row.student_id ||
    !row.exam_name
  ){

    alert(
      "Student ID ও Exam Name দিন।"
    );

    return;
  }


  const {
    error
  } =
    await db
      .from("exam_results")
      .insert(row);


  if(error){

    alert(error.message);

    return;
  }


  closeModal();

  await resultsPage();

  alert(
    "Exam Result published successfully."
  );

}

  const {

      })
      .eq(
        "id",

      );


  if(error){

    alert(error.message);

    return;
  }


  await resultsPage();

}

              <td>
                ${esc(x.email || "—")}
              </td>

              <td>
                ${esc(x.status || "pending")}
              </td>

              <td>

                <button
                  class="btn small danger"
                  onclick="
                    deleteRow(
                      'admissions',
                      '${x.id}',
                      admissionsPage
                    )
                  "
                >
                  Delete
                </button>

              </td>

            </tr>

          `
          ).join("")}

        </tbody>

      </table>

    </div>

  `;

}


/* ==================================================
   SETTINGS
================================================== */

async function settingsPage(){

  const {
    data,
    error
  } =
    await db
      .from("site_settings")
      .select("*")
      .limit(1)
      .maybeSingle();


  if(error){

    msg(error.message);

    return;
  }


  document.getElementById(
    "content"
  ).innerHTML = `

    <div class="box">

      <h2>
        ⚙️ Website Settings
      </h2>


      <div class="formgrid">

        <input
          id="setName"
          value="${esc(
            data?.institution_name ||
            "The Unified Crew Learning Center"
          )}"
          placeholder="Institution Name"
        >

        <input
          id="setPhone"
          value="${esc(
            data?.phone || ""
          )}"
          placeholder="Phone"
        >

        <input
          id="setEmail"
          value="${esc(
            data?.email || ""
          )}"
          placeholder="Email"
        >

        <textarea
          id="setTag"
          placeholder="Website tagline"
          class="full"
        >${esc(
          data?.hero_subtitle || ""
        )}</textarea>

      </div>


      <br>

      <button
        class="btn success"
        onclick="saveSettings()"
      >
        Save Website Settings
      </button>

    </div>

  `;

}


async function saveSettings(){

  const row = {

    institution_name:
      document.getElementById(
        "setName"
      ).value.trim(),

    phone:
      document.getElementById(
        "setPhone"
      ).value.trim(),

    email:
      document.getElementById(
        "setEmail"
      ).value.trim(),

    hero_subtitle:
      document.getElementById(
        "setTag"
      ).value.trim(),

    updated_at:
      new Date().toISOString()

  };


  const {
    data: old
  } =
    await db
      .from("site_settings")
      .select("id")
      .limit(1)
      .maybeSingle();


  let result;


  if(old){

    result =
      await db
        .from("site_settings")
        .update(row)
        .eq(
          "id",
          old.id
        );

  }else{

    result =
      await db
        .from("site_settings")
        .insert(row);

  }


  if(result.error){

    alert(
      result.error.message
    );

    return;
  }


  alert(
    "Website settings saved."
  );

}


/* ==================================================
   DELETE
================================================== */

async function deleteRow(
  table,
  id,
  reloadFunction
){

  if(
    !confirm(
      "আপনি কি সত্যিই Delete করতে চান?"
    )
  )
    return;


  const {
    error
  } =
    await db
      .from(table)
      .delete()
      .eq(
        "id",
        id
      );


  if(error){

    alert(error.message);

    return;
  }


  await reloadFunction();

}


/* ==================================================
   SESSION CHECK
================================================== */

async function checkSession(){

  const {
    data
  } =
    await db.auth.getSession();


  if(
    data.session &&
    data.session.user.email.toLowerCase()
      === ADMIN_EMAIL.toLowerCase()
  ){

    document.getElementById(
      "login"
    ).hidden = true;

    document.getElementById(
      "app"
    ).hidden = false;

    dashboardPage();

  }

}


/* ==================================================
   START
================================================== */

checkSession();
