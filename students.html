<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TUCLC Students</title><link rel="icon" href="assets/logo.png"><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.studentPage{min-height:100vh;padding:42px 0 70px;background:linear-gradient(135deg,#effaff,#fff5fa)}.studentHeader,.studentEmpty,.studentTableWrap{background:#fff;border-radius:22px;box-shadow:0 15px 45px rgba(0,0,0,.08)}.studentHeader{padding:24px;margin-bottom:22px}.studentHeader h1{margin:0}.studentCount{color:#64748b;margin-top:5px}.studentTableWrap{overflow:auto}.studentTable{width:100%;min-width:820px;border-collapse:collapse}.studentTable th,.studentTable td{padding:13px;border-bottom:1px solid #e7eef4;text-align:left}.studentTable th{background:#f3fbff}.studentEmpty{padding:50px;text-align:center;color:#64748b}.backBtn{margin-top:18px}</style></head><body><section class="studentPage"><div class="wrap"><div class="studentHeader"><h1 id="title">শিক্ষার্থীদের তালিকা</h1><div id="count" class="studentCount">তথ্য লোড হচ্ছে...</div></div><div id="content"><div class="studentEmpty">শিক্ষার্থীদের তথ্য লোড হচ্ছে...</div></div><a class="btn outline backBtn" href="index.html#classes">← শ্রেণিসমূহে ফিরে যান</a></div></section><script>
const db=window.supabase.createClient('https://wdiiftvtmtvsokdgyqmr.supabase.co','sb_publishable_RphPgkyVKZkZeIgklmt8hQ__W3aGPiX');
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const norm=v=>{const x=String(v??'').trim().toLowerCase(),m={play:'Play',nursery:'Nursery',one:'Class One','class one':'Class One',two:'Class Two','class two':'Class Two',three:'Class Three','class three':'Class Three',four:'Class Four','class four':'Class Four',five:'Class Five','class five':'Class Five',six:'Class Six','class six':'Class Six',seven:'Class Seven','class seven':'Class Seven',eight:'Class Eight','class eight':'Class Eight'};return m[x]||String(v??'').trim()};
(async()=>{const c=norm(new URLSearchParams(location.search).get('class')||'Play');document.getElementById('title').textContent=`${c} — শিক্ষার্থীদের তালিকা`;const {data,error}=await db.from('students').select('student_id,name,class_name,roll,batch,guardian_name,admission_date').order('roll',{ascending:true,nullsFirst:false}).order('name',{ascending:true});if(error){document.getElementById('count').textContent='তথ্য লোড হয়নি';document.getElementById('content').innerHTML='<div class="studentEmpty"><h3>শিক্ষার্থীদের তথ্য পাওয়া যাচ্ছে না।</h3></div>';return;}const rows=(data||[]).filter(s=>norm(s.class_name)===c);document.getElementById('count').textContent=`মোট শিক্ষার্থী: ${rows.length} জন`;if(!rows.length){document.getElementById('content').innerHTML='<div class="studentEmpty"><h3>এই শ্রেণিতে কোনো শিক্ষার্থীর তথ্য পাওয়া যায়নি।</h3></div>';return;}document.getElementById('content').innerHTML=`<div class="studentTableWrap"><table class="studentTable"><thead><tr><th>#</th><th>নাম</th><th>Student ID</th><th>Class</th><th>Roll</th><th>বিভাগ / Batch</th><th>Admission Date</th></tr></thead><tbody>${rows.map((s,i)=>`<tr><td>${i+1}</td><td><strong>${esc(s.name)}</strong></td><td>${esc(s.student_id)}</td><td>${esc(s.class_name||c)}</td><td>${esc(s.roll||'—')}</td><td>${esc(s.batch||'—')}</td><td>${esc(s.admission_date||'—')}</td></tr>`).join('')}</tbody></table></div>`})();
</script></body></html>
