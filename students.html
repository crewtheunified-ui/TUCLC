<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>TUCLC Students</title>

  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    .studentPage{
      min-height:100vh;
      background:linear-gradient(135deg,#effaff,#fff5fa);
      padding:40px 0 70px;
    }

    .studentHeader{
      background:#fff;
      border-radius:22px;
      padding:25px;
      margin-bottom:25px;
      box-shadow:0 12px 35px #0d3b5b12;
    }

    .studentHeader h1{
      margin:0;
      color:#10213b;
    }

    .studentHeader p{
      margin:6px 0 0;
      color:#617085;
    }

    .studentTableWrap{
      background:#fff;
      border-radius:20px;
      overflow:auto;
      box-shadow:0 12px 35px #0d3b5b12;
    }

    .studentTable{
      width:100%;
      border-collapse:collapse;
      min-width:750px;
    }

    .studentTable th,
    .studentTable td{
      padding:14px;
      border-bottom:1px solid #e7eef4;
      text-align:left;
    }

    .studentTable th{
      background:#f3fbff;
      color:#10213b;
    }

    .studentNo{
      width:55px;
      text-align:center!important;
    }

    .studentEmpty{
      text-align:center;
      padding:60px 20px;
      background:#fff;
      border-radius:20px;
      color:#617085;
      box-shadow:0 12px 35px #0d3b5b12;
    }

    .backBtn{
      margin-top:20px;
    }

    .loading{
      text-align:center;
      padding:50px;
      color:#617085;
    }
  </style>
</head>

<body>

<section class="studentPage">

  <div class="wrap">

    <div class="studentHeader">

      <div style="display:flex;align-items:center;gap:15px">

        <img
          src="assets/logo.png"
          style="width:65px;height:65px;object-fit:contain"
          alt="TUCLC Logo"
        >

        <div>

          <h1 id="classTitle">
            শিক্ষার্থীদের তালিকা
          </h1>

          <p id="classCount">
            তথ্য লোড হচ্ছে...
          </p>

        </div>

      </div>

    </div>


    <div id="studentContent">

      <div class="loading">
        শিক্ষার্থীদের তথ্য লোড হচ্ছে...
      </div>

    </div>


    <a
      class="btn outline backBtn"
      href="index.html#classes"
    >
      ← শ্রেণিসমূহে ফিরে যান
    </a>

  </div>

</section>


<script>

const SUPABASE_URL =
  "https://wdiiftvtmtvsokdgyqmr.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_RphPgkyVKZkZeIgklmt8hQ__W3aGPiX";

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const aliases = {

  "play":"Play",

  "nursery":"Nursery",

  "one":"Class One",
  "class one":"Class One",

  "two":"Class Two",
  "class two":"Class Two",

  "three":"Class Three",
  "class three":"Class Three",

  "four":"Class Four",
  "class four":"Class Four",

  "five":"Class Five",
  "class five":"Class Five",

  "six":"Class Six",
  "class six":"Class Six",

  "seven":"Class Seven",
  "class seven":"Class Seven",

  "eight":"Class Eight",
  "class eight":"Class Eight"

};


function normalizeClass(value){

  const x =
    String(value || "")
      .trim()
      .toLowerCase();

  return aliases[x] ||
    String(value || "").trim();

}


function esc(value){

  return String(value ?? "")
    .replace(/[&<>"']/g, m => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m]));

}


async function loadStudents(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  const requestedClass =
    params.get("class") || "Play";

  const className =
    normalizeClass(
      requestedClass
    );


  document.getElementById(
    "classTitle"
  ).textContent =
    `${className} — শিক্ষার্থীদের তালিকা`;


  const { data, error } =
    await db
      .from("students")
      .select(
        "student_id,name,class_name,roll,batch"
      )
      .order(
        "name",
        {
          ascending:true
        }
      );


  if(error){

    console.error(
      "Student query error:",
      error
    );

    document.getElementById(
      "classCount"
    ).textContent =
      "তথ্য load করা যায়নি";

    document.getElementById(
      "studentContent"
    ).innerHTML = `

      <div class="studentEmpty">

        <h3>
          শিক্ষার্থীদের তথ্য
          পাওয়া যাচ্ছে না।
        </h3>

        <p>
          Database query error হয়েছে।
        </p>

      </div>

    `;

    return;
  }


  const students =
    (data || []).filter(
      student =>
        normalizeClass(
          student.class_name
        ) === className
    );


  document.getElementById(
    "classCount"
  ).textContent =
    `মোট শিক্ষার্থী: ${students.length} জন`;


  if(!students.length){

    document.getElementById(
      "studentContent"
    ).innerHTML = `

      <div class="studentEmpty">

        <h3>
          এই শ্রেণিতে কোনো
          শিক্ষার্থীর তথ্য পাওয়া যায়নি।
        </h3>

        <p>
          Admin Panel থেকে Student
          information যোগ করুন।
        </p>

      </div>

    `;

    return;
  }


  document.getElementById(
    "studentContent"
  ).innerHTML = `

    <div class="studentTableWrap">

      <table class="studentTable">

        <thead>

          <tr>

            <th class="studentNo">
              #
            </th>

            <th>
              শিক্ষার্থীর নাম
            </th>

            <th>
              Student ID
            </th>

            <th>
              Class
            </th>

            <th>
              Roll
            </th>

            <th>
              Batch
            </th>

          </tr>

        </thead>

        <tbody>

          ${students.map(
            (student,index) => `

            <tr>

              <td class="studentNo">
                ${index + 1}
              </td>

              <td>
                <strong>
                  ${esc(student.name)}
                </strong>
              </td>

              <td>
                ${esc(student.student_id)}
              </td>

              <td>
                ${esc(
                  student.class_name || "—"
                )}
              </td>

              <td>
                ${esc(
                  student.roll || "—"
                )}
              </td>

              <td>
                ${esc(
                  student.batch || "—"
                )}
              </td>

            </tr>

          `
          ).join("")}

        </tbody>

      </table>

    </div>

  `;

}


loadStudents();

</script>

</body>
</html>
